<svg xmlns="http://www.w3.org/2000/svg" width="400" height="361"
      viewBox="0 0 400 361" role="img" aria-labelledby="title desc">
      <title id="title">March7 &amp; Evernight</title><desc id="desc">A Discord assistant with two independent agents connected over A2A. Shared memory and background consolidation; the self-heal framework is still in development.</desc>
