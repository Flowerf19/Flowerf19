      <rect x="1" y="1" width="398" height="359" rx="10" fill="url(#lines)"/>
      <path d="M22 22 V339" stroke="#a65c43" stroke-opacity=".26"/>
      <g font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif"><text x="40" y="38" font-size="14" fill="#a65c43" font-weight="400" text-anchor="start" font-style="italic" >Two agents, a shared memory</text><text x="360" y="39" font-size="13" fill="#82705c" font-weight="400" text-anchor="end" >03</text><text x="40" y="85" font-size="27" fill="#48372b" font-weight="400" text-anchor="start" >March7 &amp; Evernight</text><text x="40" y="124" font-size="18" fill="#82705c" font-weight="400" text-anchor="start" >A Discord assistant with two</text><text x="40" y="152" font-size="18" fill="#82705c" font-weight="400" text-anchor="start" >independent agents connected</text><text x="40" y="180" font-size="18" fill="#82705c" font-weight="400" text-anchor="start" >over A2A. Shared memory and</text><text x="40" y="208" font-size="18" fill="#82705c" font-weight="400" text-anchor="start" >background consolidation; the</text><text x="40" y="236" font-size="18" fill="#82705c" font-weight="400" text-anchor="start" >self-heal framework is still in</text><text x="40" y="264" font-size="18" fill="#82705c" font-weight="400" text-anchor="start" >development.</text><path d="M40 297 H360" stroke="#ddc7a8"/><text x="40" y="325" font-size="13" fill="#a65c43" font-weight="400" text-anchor="start" font-style="italic" >Discord · A2A · Three-tier memory</text></g>
